<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive"><title>Nouveau mot de passe — KIN Vins & Spiritueux</title>
<link rel="stylesheet" href="../assets/styles.css"><link rel="stylesheet" href="assets/admin-auth.css">
<script src="../assets/supabase-config.js"></script></head>
<body class="admin-login-body"><main class="admin-login-shell"><section class="admin-login-card">
<a class="brand admin-login-brand" href="../index.html"><span class="brand-mark">K</span><span class="brand-text"><strong>KIN</strong><small>VINS & SPIRITUEUX</small></span></a>
<p class="eyebrow">RÉCUPÉRATION DU COMPTE</p><h1>Nouveau mot de passe</h1>
<p class="muted">Définissez un nouveau mot de passe pour votre compte administrateur.</p>
<div class="admin-security-notice" id="recoveryNotice"></div>
<form id="updatePasswordForm" class="admin-login-form">
<label>Nouveau mot de passe<input type="password" name="password" autocomplete="new-password" minlength="8" required></label>
<label>Confirmer le mot de passe<input type="password" name="passwordConfirm" autocomplete="new-password" minlength="8" required></label>
<div class="password-guidance">Minimum 8 caractères. Un mot de passe long et unique est recommandé.</div>
<button class="btn btn-gold full" id="updatePasswordButton" type="submit">Enregistrer le nouveau mot de passe</button>
<p class="admin-login-error" id="updatePasswordError" role="alert"></p>
<p class="admin-login-success" id="updatePasswordSuccess" role="status"></p>
</form>
<div class="admin-login-links"><a href="login.html">← Retour à la connexion</a></div>
</section></main><script src="update-password.js"></script></body></html>
